<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جولة في شجرة العائلة</title>
  <link rel="stylesheet" href="world.css?v=pinned-branch-1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
  <script src="../../Claud/botanical-core.js" defer></script>
  <script type="module" src="world.js?v=pinned-branch-1"></script>
</head>
<body>
  <header><div><h1>جولة في شجرة العائلة</h1><p>مشهد تجريبي بأسماء وهمية</p></div><a href="../preview.html">العودة إلى بوابة العائلة</a></header>
  <main>
    <section class="controls" aria-label="أدوات الجولة">
      <label>حجم العينة <select id="size"><option>50</option><option>150</option><option>500</option></select></label>
      <label>التلوين <select id="color-mode"><option value="kinship">حسب القرابة</option><option value="generation">حسب الجيل</option><option value="gender">حسب الجنس</option></select></label>
      <label>ابحث بالاسم <input id="search" type="search" placeholder="مثال: عبدالرحمن"></label>
      <label>اختر شخصًا <select id="people"></select></label>
      <button id="overview" type="button">عرض الشجرة كاملة</button>
    </section>
    <div id="view-controls" class="view-controls" aria-label="التحكم بالمشهد">
      <button id="zoom-in" type="button">تكبير +</button>
      <button id="zoom-out" type="button">تصغير −</button>
      <button id="toggle-labels" type="button" aria-pressed="true" aria-controls="labels">إظهار الأسماء</button>
    </div>
    <section id="pinned-branch" class="pinned-branch" aria-labelledby="pinned-heading" hidden>
      <div class="pinned-header">
        <div><h2 id="pinned-heading" tabindex="-1">الفرع المثبّت</h2><p id="pinned-count"></p></div>
        <div class="pinned-actions">
          <button id="scope-branch" type="button">أظهر الشجرة كاملة</button>
          <button id="clear-pin" type="button">إلغاء التثبيت</button>
        </div>
      </div>
      <ol id="pinned-people" aria-label="أفراد الفرع المثبّت" tabindex="0"></ol>
    </section>
    <div class="layout">
      <section id="viewport" aria-label="مشهد الشجرة ثلاثي الأبعاد">
        <div id="labels"></div>
        <p id="hint">اسحب للدوران من أي مكان في المشهد. اضغط على اسم لفتح بطاقته.</p>
        <p id="fallback" hidden>الرسم ثلاثي الأبعاد غير متاح. يمكنك البحث وتصفح النسب في البطاقة.</p>
      </section>
      <aside aria-labelledby="person-name">
        <p id="generation"></p>
        <h2 id="person-name" aria-live="polite"></h2>
        <p id="person-gender"></p>
        <p id="details"></p>
        <button id="focus-person" type="button">قرّب إلى هذا الشخص</button>
        <button id="pin-person" type="button" aria-controls="pinned-branch">ثبّت فرع هذا الشخص</button>
        <h3>النسب حتى الجد</h3>
        <ol id="lineage"></ol>
        <h3>مفتاح الألوان</h3>
        <ul id="legend" class="legend" aria-live="polite"></ul>
      </aside>
    </div>
  </main>
</body>
</html>
